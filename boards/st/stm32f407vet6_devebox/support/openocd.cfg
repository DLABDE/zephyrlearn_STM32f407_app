# =============================================================================
# OpenOCD 配置 — STM32F407VET6 DevEBox + ST-LINK V2
# =============================================================================
#
# 使用方式: west flash --runner openocd
#
# 本配置适用于 ST-LINK V2 克隆版，仅连接 SWCLK/SWDIO/GND 三根线。
# 不依赖 NRST 引脚，使用软件 halt 而非硬件复位。
#
# 【与 stm32f4_disco 原配置的区别】
# 原配置使用 source [find board/stm32f4discovery.cfg]，该文件内部会
# 尝试硬件复位（reset halt），在没有 NRST 连线时会失败。
# 本配置改为分步加载 interface + target，gdb-attach 事件使用 halt 而非 reset halt。
#
# 【其他可用 interface 配置】
# ST-LINK V2     : source [find interface/stlink.cfg]
# ST-LINK V3     : source [find interface/stlink-v3.cfg]
# CMSIS-DAP      : source [find interface/cmsis-dap.cfg]
# J-Link         : source [find interface/jlink.cfg]
#
# 【其他可用 target 配置】
# STM32F1x 系列  : source [find target/stm32f1x.cfg]
# STM32F4x 系列  : source [find target/stm32f4x.cfg]
# STM32G4x 系列  : source [find target/stm32g4x.cfg]
# STM32H7x 系列  : source [find target/stm32h7x.cfg]
# =============================================================================

source [find interface/stlink.cfg]

transport select hla_swd

set CHIPNAME stm32f4x
set ENDIAN little

source [find target/stm32f4x.cfg]

$_TARGETNAME configure -event gdb-attach {
	echo "Debugger attaching: halting execution"
	halt
	gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
	echo "Debugger detaching: resuming execution"
	resume
}
