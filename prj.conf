# CONFIG_DEBUG: 启用调试符号（-g 编译选项）
# 这是所有调试功能的前提，不启用则 GDB 无法映射源码与机器码
CONFIG_DEBUG=y
# 编译优化等级（四选一，互斥）:
#   CONFIG_NO_OPTIMIZATIONS=y   → -O0  零优化，GDB完美调试，代码体积最大
#   CONFIG_DEBUG_OPTIMIZATIONS=y → -Og  调试优化甜点，GDB基本可用，体积比-O0小30-40%
#   （都不设，默认）             → -O2  速度优化，GDB变量常"optimized out"
#   CONFIG_SIZE_OPTIMIZATIONS=y → -Os  体积最小，GDB体验差
# 推荐：日常开发用 -Og（调试与空间的甜点），发布用 -Os
CONFIG_DEBUG_OPTIMIZATIONS=y


#启动MCUboot
CONFIG_BOOTLOADER_MCUBOOT=y
# 签名密钥 — 使用 MCUboot 自带的 RSA-2048 默认开发密钥
# 生产环境必须替换为自己的密钥对
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"
# Overwrite 模式配置说明:
#   CONFIG_BOOT_UPGRADE_ONLY 是 MCUboot 自身的 Kconfig，不属于应用配置
#   需在构建 MCUboot 时通过 -D 传入:
#     west build -b stm32f4_devebox bootloader/mcuboot/boot/zephyr \
#       -d build_mcuboot -- -DCONFIG_BOOT_UPGRADE_ONLY=y
#   或创建 MCUboot 板级配置文件:
#     bootloader/mcuboot/boot/zephyr/boards/stm32f4_devebox.conf

#修改主线程栈大小，不开就是默认值
CONFIG_MAIN_STACK_SIZE=4096


# CONFIG_THREAD_STACK_INFO: 在线程信息中包含栈指针和栈大小
# GDB/OpenOCD 线程感知需要，用于显示每个线程的栈使用情况
CONFIG_THREAD_STACK_INFO=y
# 启用线程监控链表
# OpenOCD 通过遍历内核线程链表枚举所有线程
CONFIG_THREAD_MONITOR=y
# CONFIG_THREAD_NAME: 允许为线程设置名称
# GDB 中显示线程名而非编号，便于识别（如 "main", "idle"）
CONFIG_THREAD_NAME=y


#启用日志子系统
CONFIG_LOG=y
#增大日志缓冲区（默认1024字节，参数系统初始化时日志密集会导致丢消息）
CONFIG_LOG_BUFFER_SIZE=4096


#GPIO子系统
CONFIG_GPIO=y
#启用输入子系统
CONFIG_INPUT=y
#GPIO按键输入驱动 (gpio-keys compatible 节点的驱动)
#当 DTS 中存在 compatible = "gpio-keys" 节点时，此选项默认启用 (default y)
#显式声明以便于理解配置意图
CONFIG_INPUT_GPIO_KEYS=y
#启用PWM子系统
CONFIG_PWM=y


#启用ADC子系统
CONFIG_ADC=y
#启用ADC调试日志
#CONFIG_ADC_LOG_LEVEL_DBG=y


#启用DMA子系统
CONFIG_DMA=y
# ADC DMA 模式（依赖 DMA 子系统 + DTS 中 ADC 节点已启用）
CONFIG_ADC_STM32_DMA=y
#关闭DMA模块日志输出
#原因：STM32F4 的 DMA V1 驱动对 burst_length 的处理存在语义不匹配——
#  Zephyr API 定义 burst_length 单位为字节，ADC 驱动设置 burst_length=2（16位数据），
#  但 DMA V1 驱动将其当作 beat 数匹配，只接受 {1,4,8,16}，导致每次 ADC DMA 读取时
#  产生 "Peripheral/Memory burst size error" 的 LOG_ERR 误报。
#  实际功能不受影响（驱动自动回退到 single burst），但 ERR 级别日志会污染日志系统。
#排查DMA问题时，可改用 CONFIG_DMA_LOG_LEVEL_ERR 或 CONFIG_DMA_LOG_LEVEL_DBG 重新开启
CONFIG_DMA_LOG_LEVEL_OFF=y


#启用UART子系统
CONFIG_SERIAL=y
#启用UART中断驱动 (uart_irq_rx_enable / uart_irq_callback_set 等 API 的开关)
#不开启的话中断 API 不会被编译进驱动, 中断永不触发
CONFIG_UART_INTERRUPT_DRIVEN=y
#启用UART异步API (uart_tx / uart_rx_enable / uart_callback_set)
#依赖 DMA, 需要 DTS 中配置 dmas 属性
CONFIG_UART_ASYNC_API=y

#启用Modbus子系统
CONFIG_MODBUS=y
#启用Modbus客户端+服务端 (Kconfig choice三选一: CLIENT / SERVER / CLIENT_SERVER)
CONFIG_MODBUS_ROLE_CLIENT_SERVER=y


#启用I2C子系统
CONFIG_I2C=y
#启用I2C Shell命令（调试用，可通过shell扫描总线、读写寄存器）
#用法: i2c scan I2C_1          — 扫描总线上所有设备
#      i2c read_byte I2C_1 0x3C 0x00  — 从地址0x3C的设备读寄存器0x00
#CONFIG_I2C_SHELL=y

#启用Display子系统（OLED SSD1306 驱动依赖）
CONFIG_DISPLAY=y
#启用SSD1306驱动（当DTS中存在 compatible="solomon,ssd1306" 节点时默认自动启用）
#显式声明以便于理解配置意图
CONFIG_SSD1306=y

#启用SPI子系统（SPI控制器驱动依赖）
CONFIG_SPI=y
#启用Flash子系统（jedec,spi-nor驱动依赖）
#CONFIG_SPI_NOR 不需要手动开启，当DTS中存在 compatible="jedec,spi-nor" 节点时自动启用
CONFIG_FLASH=y
#启用Flash页面布局信息（flash_get_page_info_by_offs 等API依赖）
CONFIG_FLASH_PAGE_LAYOUT=y


#启用文件系统子系统（VFS核心层）
CONFIG_FILE_SYSTEM=y
#启用LittleFS文件系统（嵌入式首选，掉电安全+磨损均衡）
CONFIG_FILE_SYSTEM_LITTLEFS=y
#启用Flash Map API（LittleFS通过flash_area读写底层Flash分区）
CONFIG_FLASH_MAP=y
#启用fstab自动挂载（DTS中设置automount的条目在SYS_INIT阶段自动挂载）
CONFIG_FS_LITTLEFS_FSTAB_AUTOMOUNT=y
#启用Flash Shell命令（调试用，可通过shell查看分区和Flash信息）
#CONFIG_FLASH_SHELL=y


#启用Settings子系统（参数持久化存储框架）
CONFIG_SETTINGS=y
#使用File后端（基于LittleFS文件系统存储Settings键值对）
CONFIG_SETTINGS_FILE=y
#Settings文件存储路径（必须在已挂载的LittleFS挂载点下）
CONFIG_SETTINGS_FILE_PATH="/lfs1/settings/run"
#Settings文件最大行数（超过后自动压缩去重，减少Flash占用）
CONFIG_SETTINGS_FILE_MAX_LINES=32
